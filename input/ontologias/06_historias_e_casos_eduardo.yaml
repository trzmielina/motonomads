# Domínio 03 & 15: Histórias, Vivências e Casos Reais de Eduardo Generali
# A matéria-prima de experiências que os agentes utilizam para trazer autenticidade e autoridade prática aos textos.

casos_reais_eduardo:
  - id: "eduardo_neblina_rio_do_rastro"
    titulo: "A Cerração Cega da Serra do Rio do Rastro"
    destino_associado: "serra_do_rio_do_rastro"
    situacao: "Subida da serra às 17h, onde a visibilidade caiu subitamente para menos de 3 metros com chuva e temperatura de 7°C."
    o_que_aconteceu: >
      A viseira embaçou completamente por dentro por falta de Pinlock e o farol alto batia na neblina como uma parede branca.
      Tive que abrir um dedo da viseira para enxergar a linha lateral de concreto e manter a moto em segunda marcha o tempo todo,
      tracionando suave para não perder o equilíbrio nos cotovelos mais íngremes.
    licao_pratica: >
      Nunca suba uma serra sem lente antiembaçante (Pinlock) instalada e jaqueta estanque. E a regra de ouro na neblina:
      farol baixo sempre, pisca-alerta ligado e o olhar fixado na linha da borda externa da pista para não perder a referência espacial.
    frase_eduardo: "A serra não é lugar de provar velocidade; é lugar de respeitar a montanha e manter o motor cheio."

  - id: "eduardo_pneu_rasgado_canastra"
    titulo: "O Pneu Rasgado nas Pedras da Canastra"
    destino_associado: "serra_da_canastra"
    situacao: "Descida para a parte alta da Cachoeira Casca d'Anta com a moto carregada de bagagem e pneus cheios com 36 PSI."
    o_que_aconteceu: >
      Entrei com muita pressão em uma laje pontiaguda de quartzito. O pneu traseiro bateu seco, trincou a carcaça lateral
      e esvaziou instantaneamente. Estávamos a 40 km do vilarejo mais próximo, sem sinal celular e o sol do meio-dia fritando.
      Tentamos colocar 3 macarrões no rasgo, mas a pressão vazava pela lateral.
    licao_pratica: >
      Na pedra afiada, pneu muito duro não deforma sobre o obstáculo e acaba cortando. A pressão precisa ser aliviada para 24 PSI.
      E para salvar a viagem, só conseguimos sair dali porque tínhamos levado uma câmara de ar aro 21 reserva na bagagem,
      que coube na roda traseira aro 18 em caráter de emergência e permitiu rodar até a pousada.
    frase_eduardo: "Ferramenta e câmara reserva na mala não são peso morto; são o seu passaporte de volta para casa."

  - id: "eduardo_areiao_jalapao_peso"
    titulo: "O Mergulho no Areião Fofo do Jalapão"
    destino_associado: "jalapao"
    situacao: "Primeira expedição com Big Trail pesada com malas de alumínio carregadas rumo a Mateiros."
    o_que_aconteceu: >
      Na primeira valeta de areia fina e fofa, o instinto inicial foi segurar o guidão com força e frear no susto.
      A roda dianteira cravou até o eixo e eu voei por cima da bolha. Foram 40 minutos sob sol de 38°C para desenterrar
      a moto que parecia estar chumbada no chão.
    licao_pratica: >
      Areia é contraintuitiva para quem só pilota no asfalto: você não pode frear a dianteira e jamais deve segurar o guidão tenso.
      Você precisa levantar nas pedaleiras, jogar o quadril para trás, deixar o guidão dançar solto nas mãos e manter o acelerador
      aberto. Quem acelera plana na areia; quem hesita e tira a mão afunda.
    frase_eduardo: "Na areia, a indecisão é o seu pior inimigo. O acelerador é quem manda na direção."

  - id: "eduardo_vento_patagonico_rajada"
    titulo: "A Rajada Lateral de 90 km/h na Ruta 40"
    destino_associado: "ruta_40_patagonia"
    situacao: "Travessia no rípio aberto entre Gobernador Gregores e Tres Lagos na Argentina."
    o_que_aconteceu: >
      O vento oeste soprava de lado como um martelo invisível. Pilotávamos com a moto permanentemente inclinada a uns 20 graus
      apenas para conseguir andar em linha reta. De repente, um caminhão tanque cruzou no sentido oposto: ele criou uma zona de vácuo
      onde a moto caiu reta e, assim que o caminhão passou, a rajada voltou com força total jogando a moto 2 metros para a valeta do acostamento.
    licao_pratica: >
      No vento patagônico, reduza uma marcha para manter o motor em giro alto (o giro do virabrequim e das rodas atua como um giroscópio
      estabilizador). E ao cruzar com veículos pesados, antecipe o vácuo: não espere o choque de ar acontecer para reagir.
    frase_eduardo: "A Patagônia te ensina humildade em cada curva. Ali, quem manda no ritmo é o vento."

  - id: "eduardo_nevoeiro_trollstigen_atlantico"
    titulo: "O Nevoeiro Fechado de Trollstigen e o Vento Salgado da Atlantic Ocean Road"
    destino_associado: "escandinavia_fiordes_noruega"
    situacao: "Subida dos 11 cotovelos do Trollstigen sob garoa de 6°C seguida pela travessia da ponte Storseisundet com mar revolto."
    o_que_aconteceu: >
      No meio da subida do Trollstigen, a névoa baixou tanto que a cascata Stigfossen sumiu a cinco metros de nós. O asfalto estava
      encharcado e qualquer toque bruto no freio dianteiro em curva fechada derrubaria a Big Trail de 260 kg. Duas horas depois,
      na Atlantic Ocean Road, as ondas do Mar da Noruega batiam nas pilastras da ponte e jogavam spray salgado na viseira,
      com vento de través tentando desviar a frente da moto.
    licao_pratica: >
      Na Noruega, quem anda com pressa perde a paisagem e arrisca a segurança. A regra é manter a segunda marcha cheia nas curvas íngremes,
      nunca descer no neutro, usar sempre Pinlock 120 e jaqueta laminada (que repele a água por fora sem encharcar o tecido).
      Ao entrar nos ferryboats, cruze as grelhas de metal molhadas com a moto completamente reta e sem tocar no freio dianteiro.
    frase_eduardo: "A Escandinávia não quer saber da sua pressa. O norte exige respeito, equipamento estanque e olhos atentos em cada curva."

  - id: "eduardo_vento_bora_jadranska_magistrala"
    titulo: "O Vento Bora na Jadranska Magistrala e o Asfalto Calcário Dálmata"
    destino_associado: "adriatico_costa_dalmata_balcas"
    situacao: "Pilotagem na rodovia D8 entre Senj e Zadar com rajadas laterais do vento Bora descendo da Cordilheira Velebit."
    o_que_aconteceu: >
      O Mar Adriático estava de um azul inacreditável, mas assim que dobramos uma curva aberta de penhasco, fomos atingidos
      por uma rajada lateral de mais de 70 km/h descendo a montanha. O asfalto dálmata, composto por agregados de calcário branco,
      tinha acabado de receber uma garoa rápida e parecia uma pista encerada. Quem tentou frear forte na curva quase perdeu a frente.
    licao_pratica: >
      Na costa da Croácia, asfalto calcário molhado não aceita frenagens bruscas; reduza a velocidade antes de inclinar a moto
      e acelere de forma progressiva. Quando o vento Bora bater, pilote com o corpo firme, cotovelos flexionados e motor em giro
      médio para manter o efeito giroscópico das rodas estabilizando a trajetória.
    frase_eduardo: "O Adriático é puro deleite para quem sabe ler o asfalto. Ali, a calma no acelerador é o que separa um passeio espetacular de um susto desnecessário."

  - id: "eduardo_altitude_paso_de_jama_atacama"
    titulo: "A Barreira dos 4.800 Metros no Paso de Jama e o Ar Rarefeito da Puna"
    destino_associado: "deserto_atacama_puna_andes"
    situacao: "Travessia da Cordilheira dos Andes entre Purmamarca e San Pedro de Atacama com temperatura de -2°C e altitude de 4.820m."
    o_que_aconteceu: >
      Subindo a Cuesta de Lipán em direção ao Paso de Jama, o piloto sente a moto perder cerca de 25% a 30% da potência volumétrica
      pela falta de oxigênio, mesmo com injeção eletrônica de ponta. Mas o maior perigo é com o próprio piloto: se você não
      se hidratar com pelo menos 3 litros de água por dia e subir rápido demais sem aclimatação, o soroche (mal de altitude)
      bate com dor de cabeça forte, náusea e perda de reflexo no guidão.
    licao_pratica: >
      Na altitude dos Andes, a pressa é fatal. Suba com aclimatação gradual dormindo em altitudes intermediárias, beba água
      continuamente mesmo sem sentir sede e use o carro de apoio para levar oxigênio medicinal e toda a bagagem pesada.
      Pilotar uma moto leve faz você gastar metade da energia física para manobrar na altitude extrema.
    frase_eduardo: "A cordilheira impõe respeito em cada metro de subida. Nos Andes, quem cuida da respiração e da máquina chega aonde quiser com tranquilidade."
